# Builds and pushes the service images to ECR, then deploys them to EKS.
name: Build and Push

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "k8s/**"
  workflow_dispatch: # manual run: handy for re-pushing images

permissions:
  id-token: write # OIDC: the job gets a short-lived token, no access keys
  contents: read

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [service-a, service-b]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA_TAG: ${{ github.sha }} # grading 1.3: tag images with the commit SHA
        run: |
          IMAGE="$REGISTRY/${{ matrix.service }}"
          docker build -t "$IMAGE:$SHA_TAG" -t "$IMAGE:latest" "src/${{ matrix.service }}"
          docker push "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy to EKS
    needs: build # runs only after both images are pushed (grading 1.8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name csepella-eks-task --region ${{ vars.AWS_REGION }}

      - name: Apply manifests
        run: kubectl apply -f k8s/

      - name: Roll out SHA-tagged images
        env:
          SHA_TAG: ${{ github.sha }}
        run: |
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"
          kubectl -n apps set image deploy/service-a service-a="$REGISTRY/service-a:$SHA_TAG"
          kubectl -n apps set image deploy/service-b service-b="$REGISTRY/service-b:$SHA_TAG"
          kubectl -n apps rollout status deploy/service-a --timeout=180s
          kubectl -n apps rollout status deploy/service-b --timeout=180s
