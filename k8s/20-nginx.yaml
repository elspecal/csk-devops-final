apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: apps
data:
  nginx.conf: |
    events {}

    http {
      # re-resolve upstream names so pod restarts don't break routing
      resolver kube-dns.kube-system.svc.cluster.local valid=5s;

      server {
        listen 80;

        location /api/sa {
          set $upstream service-a.apps.svc.cluster.local;
          proxy_pass http://$upstream:80;
        }

        location /api/sb {
          set $upstream service-b.apps.svc.cluster.local;
          proxy_pass http://$upstream:80;
        }

        # served by nginx itself, used by the NLB health check
        location /health {
          return 200 "ok";
        }
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nginx-proxy
  namespace: apps
spec:
  selector:
    matchLabels: { app: nginx-proxy }
  template:
    metadata:
      labels: { app: nginx-proxy }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests: { cpu: 50m, memory: 64Mi }
      volumes:
        - name: config
          configMap:
            name: nginx-config
